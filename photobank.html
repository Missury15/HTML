<!DOCTYPE html>
<html>
  <head>
    <title>Photobank</title>
    <link rel="icon" href="Images/Tab-Icon.png" />
    <link rel="stylesheet" href="photobankStyle.css" />
  </head>
  <body>
    <h1 class="Headding">Náhodné obrázky</h1>
    <p class="popisek">
      Tady najdeš všelijaké obrázky.
      <br />
      Refreshuj si stránku jak dlouho jen budeš chtít :D
    </p>
    <div class="gallery">
      <div class="placeholder">
        <img src="https://picsum.photos/300/180?random=1" alt="Photo 2" />
      </div>
      <div class="placeholder">
        <img src="https://picsum.photos/300/180?random=2" alt="Photo 2" />
      </div>
      <div class="placeholder">
        <img src="https://picsum.photos/300/180?random=3" alt="Photo 3" />

      <div class="placeholder">
        <img src="https://picsum.photos/300/180?random=4" alt="Photo 4" />
      </div>
      <div class="placeholder">
        <img src="https://picsum.photos/300/180?random=5" alt="Photo 5" />
      </div>
      <div class="placeholder">
        <img src="https://picsum.photos/300/180?random=6" alt="Photo 5" />
      </div>
    </div>
    <div class="btn-container">
      <form>
        <button class="refresh" type="submit">Obnovit stránku</button>
      </form>

      <a
        class="contact"
        href="contact.html"
        target="_self"
        title="This helps you to contact me"
      >
        Contact me!
      </a>

      <button class="menu">Menu</button>

    <script src="photobankScript.js"></script>

</html>
